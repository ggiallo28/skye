# Size and load budgets for Skye. Checked by tests/budget and by the "budgets"
# GitHub workflow on every pull request. See docs/project/budgets.md.
#
# Principles, in this order of preference, for everything Skye imports:
#   1. the Python standard library;
#   2. libraries the AWS Lambda Python runtime already contains (see [lambda] below);
#   3. pure-Python packages (wheel tagged py3-none-any), only when 1 and 2 cannot do the job;
#   4. never a compiled package (C or Rust extension) in the core: the library is I/O bound,
#      and a compiled wheel forces a container build for the right architecture and Python.
# The lists below record where Skye stands today. They only shrink.
#
# Rule: a budget only goes DOWN. Raising a number needs a reason in the PR and a
# review from the owner of this file (.github/CODEOWNERS).
#
# Values were measured on 2026-10-30, Python 3.13, macOS arm64, wheels from PyPI. The pull-request workflow measures on Linux x86_64,
# where the compiled wheels are larger: the limits below apply there. To measure from any machine:
# `uv pip install --target DIR --python-platform x86_64-manylinux_2_28 --python-version 3.13 "skyeai[extra] @ file:///path/to.whl"`.
# "now" is what was measured, "max" is what the test enforces (headroom for
# dependency patch releases), "target" is where the module should end up.

[core]
# Install with no extras.
# Decision D49: the core has no third-party dependency. The only distribution is skyeai itself.
# Measured 2026-11-07 (task 14.4 of 0-base-structure): wheel built with `uv build --wheel`, installed with `uv pip install --no-deps` in a
# fresh venv (Python 3.13, macOS arm64; the wheel is pure Python, py3-none-any): 1 distribution, 1.13 MB (the whole package, no compiled file).
max_distributions = 1               # now 1 (skyeai); was 12, 10 with pydantic and tenacity
max_installed_mb = 2                # now 1.8 (2026-11-11); was 11, 9.0 with pydantic-core (compiled)
allowed_dependencies = []
# Modules that fail to import on a core-only install. Each entry must be fixed
# (move the import behind LazyImporter, or declare the dependency) and removed.
# The test fails if an entry starts working, so the list cannot go stale.
# Compiled (non pure-Python) distributions in the core install. Target: none.
# The test fails if the set changes, in either direction.
known_compiled = []
known_import_failures = []

# Third-party libraries imported at module level in src/skye, with the number of
# files that import them. Standard library and Lambda libraries are always allowed.
# Anything else must be listed here; the count must match exactly, so every fix lowers
# it (and removes the dependency when it reaches zero). Target: empty.
[cold_start]
# Cold start of the library itself, in a fresh interpreter: import skye, import the router, build a router with one target and
# a request. No network. This is the part of a serverless cold start that the library controls.
#
# Why this number. A thin Python function on AWS Lambda starts in about 100 to 300 ms (the init phase); `import boto3` alone costs
# 150 to 250 ms; an init of 500 to 2000 ms is usually acceptable for an LLM application, because a model call takes seconds. The
# library therefore keeps its own cold path under one `import boto3`: 200 ms best of 5 on a CI runner, which is about three times
# what a laptop measures (56 ms best of 10 on 2026-11-07, clean core install). A SDK-based client (OpenAI, Anthropic, boto3) adds seconds; that is what the standard-library adapters avoid.
max_cold_start_ms = 200             # best of 5, now about 56 on a laptop (was 300, about 95 with pydantic)
target_cold_start_ms = 100          # where the path should stay on a laptop
runs = 5

[prompts]
# The time of `BasePromptBuilder()` in a fresh interpreter, the first one of the process (the cache of the compiled bundled templates is empty): the
# builder registers the 40 bundled templates (their text and version) and compiles each at its first use (task 24.8, open decision O78). A
# serverless handler that makes a builder pays this at every cold start. Measured on 2026-11-12: about 130 ms before (every bundled template compiled
# at once, and the default filters read), 2.8 ms after (best of 10 on a laptop); the limit is 10 ms because a CI runner is slower and the test takes the
# best of 10. The first compile of a template (0.5 ms for a small one, 3.5 ms for the largest) and the one-time load of the registrar for the filters
# (about 17 ms, at the first render) are not in this number. Like the other budgets, this limit only goes down.
max_builder_ms = 10                 # best of 10, now about 2.8 on a laptop (was about 130)
runs = 10

# D49: the core has no third-party import. A library that comes back must be listed here with its file count (target: empty).
[imports.max_files]

[load]
# `import skye` in a fresh interpreter. Module count, time and memory are measured
# in a clean core-only environment (tests/budget/test_footprint_budget.py), because a
# development environment has extra libraries installed. The forbidden-import check
# also runs in every normal test run.
max_modules_loaded = 80             # now 58 (was 340, 293 with pydantic)
max_import_ms = 100                 # best of 5, now about 16 on a laptop (CI runners are slower)
max_rss_delta_mb = 16               # now about 5
# Importing skye must not import any provider SDK or optional dependency.
# Known leaks: libraries that `import skye` still imports when they are installed.
# Empty: tools/remote_api.py now uses the stdlib transport (skye.base.http). The test
# fails if a listed library stops leaking, so only add an entry for a real, known leak.
known_leaks = []
forbidden_at_import = [
  "openai", "anthropic", "boto3", "botocore", "google", "azure", "cohere",
  "redis", "psycopg2", "httpx", "requests", "tiktoken",
  "opentelemetry", "prometheus_client", "numpy", "asyncpg", "fastmcp", "yaml",
]

[lambda]
# Libraries that the AWS Lambda Python runtime already contains. They do not
# count towards the size of a deployment package.
preinstalled = ["boto3", "botocore", "s3transfer", "jmespath", "python-dateutil", "six", "urllib3"]
unzipped_limit_mb = 250             # hard AWS limit for code plus layers
profile_extra = "bedrock"           # the serverless profile: core + this extra
max_profile_mb = 3                  # core + bedrock without the preinstalled libraries, now 1.8 (bedrock has no library of its own)
# The deployment zip of examples/serverless/lambda_zip (the library and handler.py, nothing else), deflate level 9.
zipped_limit_mb = 50                # hard AWS limit for a zip uploaded directly
max_zip_mb = 1                      # now 0.56 (1.76 unzipped), measured 2026-11-11

# Megabytes added over the core install, preinstalled libraries excluded, and the number of
# compiled distributions added over the core install (target 0 for every extra).
# The mcp Extra (fastmcp, the optional substitute for the built-in stdlib MCP client) has no budget here:
# it is an optional third-party library chosen only by create_mcp_client(target, impl="fastmcp"), so it is
# listed in `not_gated` of [extras_policy] (decision D67). The tools Extra carries no third-party library.

# The auth Extra declares only `rsa` (pure Python, RS256). Measured 2026-11-02: rsa + pyasn1, 1 MB.
[extras.auth]
max_compiled_over_core = 0
max_over_core_mb = 1
target_over_core_mb = 1

# Store backends: one extra per backend (decision D99). The redis Extra declares only `redis` (pure Python; the
# numbers are those of the former memory Extra, which carried it until D99).
[extras.redis]
max_compiled_over_core = 0
max_over_core_mb = 13
target_over_core_mb = 4

# The valkey Extra declares only `valkey` (valkey-py, pure Python, a fork of redis-py; D102). Measured 2026-11-11
# (`make budget`, macOS arm64, 2 packages): +1.1 MB, 0 compiled; the limit left from the redis Extra (13 MB) is lowered.
# The footprint job confirms it on Linux x86_64.
[extras.valkey]
max_compiled_over_core = 0
max_over_core_mb = 3
target_over_core_mb = 2

# The postgres Extra declares only `pg8000` (pure Python, with scramp and asn1crypto; decision D100). Measured
# 2026-11-11 (`make budget`, macOS arm64, 6 packages): +1.7 MB, 0 compiled; the limit was 4 MB. The footprint job
# confirms it on Linux x86_64.
[extras.postgres]
max_compiled_over_core = 0
max_over_core_mb = 3
target_over_core_mb = 2

# The postgres-asyncpg Extra declares only `asyncpg`, the faster compiled driver. Its wheel is large (+14.0 MB on
# Linux x86_64, 2026-11-02, then measured as the postgres Extra), which is why it is a separate choice.
[extras.postgres-asyncpg]
max_compiled_over_core = 1
max_over_core_mb = 15
target_over_core_mb = 2

[extras.tokens]
max_compiled_over_core = 4
max_over_core_mb = 20
target_over_core_mb = 4

# Extras that have no dependencies today. They are modules, not extras: remove them
# from pyproject.toml and from this list. The test fails if an extra is empty and
# not listed here, and if a listed extra stops being empty.
[tokens]
# The tokens Skye adds to what the caller wrote when it calls a model, counted offline on the request it builds (the estimate of
# TokenCounter, the same on every machine): the text of the wire messages minus the text of the caller. See tests/budget/test_token_overhead.py.
# Skye's own prompt templates are not counted (they are text the caller chose). The call through an agent has no row until the agent
# loop exists (3-runtime-agents).
# While enforce is false the test only reports in the job summary and never fails; set it to true when the limits are agreed.
# Measured 2026-11-12 (OpenAI-compatible request, estimate counter). Like the other budgets, a limit only goes down.
enforce = false

direct_plain = { now = 0, max = 0 }                    # one user message: Skye adds nothing
direct_system_and_user = { now = 0, max = 0 }          # a system and a user message: Skye adds nothing
direct_forced_choice_emulated = { now = 17, max = 20 } # the instruction added for a model that refuses a forced tool (D109)

[extras_policy]
known_empty = ["agents", "memory", "guard", "observe", "prompts", "teams", "flows", "tools", "openai", "bedrock", "anthropic", "google", "cohere"]   # provider extras are empty: one built-in stdlib REST adapter each (Requirement 20); "observe" has no telemetry import yet. "tools" carries no third-party library: fastmcp lives in the separate "mcp" extra (Requirement 15).
# Convenience bundles. They are not budgeted one by one: each member extra is.
bundles = ["llm-providers", "embedding-providers", "all-providers", "providers", "all"]
# Extras that only install an optional third-party library Skye does not need (Requirement 7.10, decision D67):
# not measured by the footprint gate. Skye itself (the core and every other extra) stays under its budgets.
not_gated = ["mcp", "aws"]   # aws: boto3, preinstalled in AWS Lambda; outside Lambda it is the AWS SDK itself, not Skye (D99)
