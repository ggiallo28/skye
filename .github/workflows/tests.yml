name: tests

# The unit, integration and example tests, offline (no key, no network). The size and load budgets run in budgets.yml.
# stress (timing) and differential (needs the official SDKs, `make differential`) are left out; budget needs a clean install.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]  # the oldest supported Python (requires-python >=3.11, D49) and the newest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ matrix.python == '3.13' }}  # the one job that saves the cache; the others only restore it
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --locked --python ${{ matrix.python }}
      - name: Tests
        run: uv run --python ${{ matrix.python }} pytest tests --ignore=tests/budget -n auto -m "not stress and not differential and not budget" -q
