name: budgets

# Size and load budgets for Skye (see budgets.toml and docs/project/budgets.md).
# A pull request that makes the library heavier, slower to load, or dependent on a
# compiled package fails here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: budgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast checks (python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]  # the oldest supported Python (requires-python >=3.11, D49) and the newest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --locked --python ${{ matrix.python }}
      - name: Dependency policy, import audit, import leaks, token overhead
        env:
          SKYE_BUDGET_REPORT: ${{ runner.temp }}/budget-report.md
        run: uv run --python ${{ matrix.python }} pytest tests/budget -q
      - name: Job summary
        if: always()
        run: |
          [ -f "${{ runner.temp }}/budget-report.md" ] && cat "${{ runner.temp }}/budget-report.md" >> "$GITHUB_STEP_SUMMARY" || true

  footprint:
    name: footprint (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - "test_core or test_serverless"
          # one target per extra that has a budget in budgets.toml (tests/budget/test_workflow_matrix.py keeps the list in step)
          - "test_extra_footprint and auth"
          - "test_extra_footprint and postgres"
          - "test_extra_footprint and postgres-asyncpg"
          - "test_extra_footprint and redis"
          - "test_extra_footprint and tokens"
          - "test_extra_footprint and valkey"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --group dev --locked --python 3.13
      - name: Install into clean environments and measure
        env:
          SKYE_BUDGET_REPORT: ${{ runner.temp }}/budget-report.md
        run: |
          echo "| what | packages / modules | size / time | memory / compiled |" >> "$SKYE_BUDGET_REPORT"
          echo "|---|---|---|---|" >> "$SKYE_BUDGET_REPORT"
          uv run --python 3.13 pytest tests/budget -m budget -q -k "${{ matrix.target }}"
      - name: Job summary
        if: always()
        run: |
          [ -f "${{ runner.temp }}/budget-report.md" ] && cat "${{ runner.temp }}/budget-report.md" >> "$GITHUB_STEP_SUMMARY" || true
