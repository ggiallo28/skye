    tests/unit/prompts/test_bundled_names.py
    tests/unit/prompts/test_bundled_samples.py
    tests/unit/prompts/test_catalogue_gallery.py
    tests/unit/prompts/test_catalogue_include.py
    tests/unit/prompts/test_register_template_include.py
