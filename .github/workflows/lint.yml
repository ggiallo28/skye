    tests/unit/utils/test_cli_include_override.py
    tests/unit/utils/test_include_resolver.py

jobs:
  lint:
    name: ruff and black
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
      - run: uv python install 3.13
      - run: uv sync --group dev --locked --python 3.13
      - name: ruff
        run: uv run --python 3.13 ruff check $LINTED
      - name: black
        run: uv run --python 3.13 black --check $LINTED
