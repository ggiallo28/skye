name: Bug report
description: Something in Skye does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For questions and ideas, please use [Discussions](https://github.com/ggiallo28/skye/discussions).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Say what you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal example
      description: The smallest code that shows the problem. Remove API keys, tokens and other secrets before you paste it.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skye version
      placeholder: "0.1.1, run: pip show skyeai"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python and platform
      placeholder: "Python 3.12, macOS 15 or AWS Lambda python3.12"
  - type: input
    id: extras
    attributes:
      label: Extras installed
      placeholder: "for example skyeai[bedrock], or none"
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full traceback or log. Remove secrets before you paste it.
      render: shell
